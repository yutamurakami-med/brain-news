<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f1d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="はるドクNews">
<meta name="description" content="医師が選ぶ、脳と健康寿命のニュース">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>はるドクNews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: SmartNews-style colored tab rail + hero card + thumbnail list; single column phone frame, centered on desktop */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --fg:#1b1f1d; --muted:#6a716d; --line:#e2e5e2;
  --brain:#3b5bdb; --longev:#0c8a6a; --prev:#e8590c; --career:#c2255c; --policy:#5f3dc4; --top:#1b1f1d;
  --font-display:"M PLUS 1p","Hiragino Sans",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --tab: var(--top);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#1a1e1c; --fg:#ecefed; --muted:#9aa29e; --line:#2b302d;
  --brain:#7b93f5; --longev:#3cc39c; --prev:#ff9150; --career:#f06595; --policy:#a58cf0; --top:#ecefed; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#1a1e1c; --fg:#ecefed; --muted:#9aa29e; --line:#2b302d;
  --brain:#7b93f5; --longev:#3cc39c; --prev:#ff9150; --career:#f06595; --policy:#a58cf0; --top:#ecefed; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--surface);box-shadow:0 0 0 1px var(--line);padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface)}
.brand{display:flex;align-items:baseline;justify-content:space-between;padding-block:12px 6px}
.logo{font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:.02em}
.logo b{color:var(--tab);transition:color .25s}
.date{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-block:4px 0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;cursor:pointer;font:700 13px var(--font-display);padding:8px 14px 7px;border-radius:8px 8px 0 0;color:#fff;opacity:.55;transition:opacity .2s,transform .2s;transform:translateY(3px)}
.tab[aria-selected="true"]{opacity:1;transform:none}
.tab:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.rail{height:4px;background:var(--tab);transition:background .25s}
.status{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding-block:10px 4px}
.sample{font-size:11px;font-weight:700;color:var(--tab);border:1px solid currentColor;border-radius:4px;padding:0 6px}
.thumb{position:relative;overflow:hidden;border-radius:6px;display:grid;place-items:center;color:#fff;font:800 13px var(--font-display)}
.thumb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.12) 0 2px,transparent 2px 10px)}
.thumb span{position:relative;z-index:1;opacity:.9}
.hero{display:grid;gap:10px;padding-block:8px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.hero .thumb{aspect-ratio:16/8;max-width:100%;font-size:28px}
.hero h2{font:800 20px/1.4 var(--font-display);margin:0;text-wrap:balance}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.chip{font-weight:700;color:#fff;border-radius:3px;padding:0 6px;font-size:11px}
.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:12px;padding-block:14px;border-bottom:1px solid var(--line);cursor:pointer}
.item h3{font:700 15px/1.5 var(--font-display);margin:0 0 6px}
.item .thumb{width:92px;height:72px}
.hero:hover h2,.item:hover h3{color:var(--tab)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
nav.bottom button{background:none;border:0;padding:10px 0;font:700 11px var(--font-display);color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
nav.bottom button[aria-current="true"]{color:var(--fg)}
nav.bottom svg{width:22px;height:22px}
/* detail */
.detail{position:fixed;inset:0;z-index:20;background:var(--surface);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.detail .wrap{max-width:480px;margin:0 auto;padding-block:8px 40px}
.dbar{display:flex;justify-content:space-between;align-items:center;padding-block:8px}
.dbar button{background:none;border:1px solid var(--line);color:var(--fg);border-radius:20px;padding:6px 14px;font:700 13px var(--font-display);cursor:pointer}
.dbar button.saved{background:var(--tab);color:#fff;border-color:var(--tab)}
.detail h1{font:800 22px/1.45 var(--font-display);margin:12px 0 8px;text-wrap:balance}
.detail .thumb{aspect-ratio:16/8;max-width:100%;font-size:28px;margin-block:12px}
.label{font:800 12px var(--font-display);letter-spacing:.08em;color:var(--muted);margin:20px 0 6px}
.summary li{margin-bottom:6px}
.comment{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;background:var(--bg);border-radius:10px;padding:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--tab);color:#fff;display:grid;place-items:center;font:800 16px var(--font-display)}
.comment strong{font-family:var(--font-display);font-size:13px}
.comment p{margin:4px 0 0}
.src{font-size:12px;color:var(--muted);margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
html,body{margin:0;height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand gut"><div class="logo">はるドク<b>News</b></div><div class="date" id="date"></div></div>
    <div class="tabs gut" id="tabs" role="tablist"></div>
    <div class="rail"></div>
  </header>
  <main class="gut" id="main"></main>
</div>

<nav class="bottom"><div class="inner">
  <button id="nav-news" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>ニュース</button>
  <button id="nav-saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>保存</button>
  <button id="nav-about"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>このアプリ</button>
</div></nav>

<div class="detail" id="detail" hidden></div>

<script>
const CATS=[
 {id:"top",name:"トップ",c:"--top"},
 {id:"brain",name:"脳神経",c:"--brain"},
 {id:"longev",name:"抗加齢・ロンジェビティ",c:"--longev"},
 {id:"prev",name:"予防医療",c:"--prev"},
 {id:"career",name:"医師キャリア・副業",c:"--career"},
 {id:"policy",name:"政策・規制",c:"--policy"}];
let A=[],UPDATED="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isSample=()=>A.length>0&&A.every(a=>a.source==="サンプル記事");
const when=a=>{if(!a.date)return a.time||"";const[,m,d]=a.date.split("-");return `${+m}/${+d} ${a.time}`};
const updLabel=()=>{const m=UPDATED.match(/T(\d{2}):/);return m?`${+m[1]}時に更新`:"1日3回更新"};

let state={cat:"top",view:"news",saved:new Set()};
try{JSON.parse(localStorage.getItem("haru-saved")||"[]").forEach(i=>state.saved.add(String(i)))}catch(e){}
const persist=()=>{try{localStorage.setItem("haru-saved",JSON.stringify([...state.saved]))}catch(e){}};
const col=v=>`var(${v})`;const catOf=id=>CATS.find(c=>c.id===id);
const glyph={brain:"脳",longev:"齢",prev:"防",career:"医",policy:"政"};
const thumb=a=>`<div class="thumb" style="background:${col(catOf(a.cat).c)}"><span>${glyph[a.cat]}</span></div>`;
const chip=a=>`<span class="chip" style="background:${col(catOf(a.cat).c)}">${catOf(a.cat).name}</span>`;

document.getElementById("date").textContent=new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
const tabsEl=document.getElementById("tabs");
tabsEl.innerHTML=CATS.map(c=>`<button class="tab" role="tab" data-id="${c.id}" style="background:${col(c.c)}">${c.name}</button>`).join("");
tabsEl.onclick=e=>{const b=e.target.closest(".tab");if(b){state.cat=b.dataset.id;state.view="news";render();}};

function render(){
  const c=catOf(state.cat);
  document.documentElement.style.setProperty("--tab",state.view==="news"?col(c.c):"var(--top)");
  tabsEl.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",state.view==="news"&&b.dataset.id===state.cat));
  ["news","saved","about"].forEach(v=>document.getElementById("nav-"+v).setAttribute("aria-current",state.view===v));
  const main=document.getElementById("main");
  if(state.view==="about"){
    main.innerHTML=`<div class="status"><span>このアプリについて</span></div>
    <p style="font:800 18px var(--font-display);margin:8px 0">医師が選ぶ、脳と健康寿命のニュース</p>
    <p>脳神経、抗加齢・ロンジェビティ、予防医療、医師のキャリアに関するプレスリリースや公的発表から毎日数本を選び、医師のコメントを添えてお届けします。</p>
    <div class="label">配信</div><p>毎日 12時・18時・22時ごろ</p>
    <div class="label">要約について</div><p>各発表をもとにAIで要約し、医師が確認しています。正確な内容は原文をご確認ください。</p>
    ${isSample()?'<p class="src">※ 現在表示中の記事はデザイン確認用のサンプルです。</p>':""}`;return;}
  let list=state.view==="saved"?A.filter(a=>state.saved.has(String(a.id))):(state.cat==="top"?A:A.filter(a=>a.cat===state.cat));
  list=[...list].sort((x,y)=>((y.date||"")+y.time).localeCompare((x.date||"")+x.time));
  const head=`<div class="status"><span>${state.view==="saved"?"保存した記事":"最新の配信・"+updLabel()}</span>${isSample()?'<span class="sample">サンプル記事</span>':""}</div>`;
  if(!list.length){main.innerHTML=head+`<div class="empty">保存した記事はまだありません。<br>記事を開いて「保存」を押すとここに並びます。</div>`;return;}
  const [h,...rest]=list;
  main.innerHTML=head+`<article class="hero" data-id="${h.id}">${thumb(h)}<h2>${esc(h.t)}</h2><div class="meta">${chip(h)}<span>${when(h)}配信</span></div></article>
  <ul class="list">${rest.map(a=>`<li class="item" data-id="${a.id}"><div><h3>${esc(a.t)}</h3><div class="meta">${chip(a)}<span>${when(a)}</span></div></div>${thumb(a)}</li>`).join("")}</ul>`;
}
document.getElementById("main").onclick=e=>{const el=e.target.closest("[data-id]");if(el)openDetail(el.dataset.id)};
function openDetail(id){
  const a=A.find(x=>String(x.id)===id),d=document.getElementById("detail");if(!a)return;
  document.documentElement.style.setProperty("--tab",col(catOf(a.cat).c));
  const sv=state.saved.has(id);
  d.innerHTML=`<div class="wrap gut"><div class="dbar"><button id="back">← 戻る</button><button id="save" class="${sv?"saved":""}">${sv?"保存済み":"保存"}</button></div>
  <div class="meta">${chip(a)}<span>${when(a)}配信</span></div><h1>${esc(a.t)}</h1>${thumb(a)}
  <div class="label">ポイント</div><ul class="summary">${a.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
  <div class="label">医師のひとこと</div><div class="comment"><div class="avatar">は</div><div><strong>はる（医師・脳神経外科／抗加齢医学専門医）</strong><p>${esc(a.m)}</p></div></div>
  <p class="src">出典：${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(a.source)} ↗</a>`:esc(a.source||"")}<br>要約はAIで作成し、医師が確認しています。正確な内容は原文をご確認ください。</p></div>`;
  d.hidden=false;d.scrollTop=0;
  d.querySelector("#back").onclick=()=>{d.hidden=true;render();};
  d.querySelector("#save").onclick=e=>{state.saved.has(id)?state.saved.delete(id):state.saved.add(id);persist();const s=state.saved.has(id);e.target.textContent=s?"保存済み":"保存";e.target.classList.toggle("saved",s);};
}
document.getElementById("nav-news").onclick=()=>{state.view="news";render()};
document.getElementById("nav-saved").onclick=()=>{state.view="saved";render()};
document.getElementById("nav-about").onclick=()=>{state.view="about";render()};
fetch("articles.json?"+Date.now()).then(r=>r.json()).then(d=>{A=d.articles||[];UPDATED=d.updated||"";render();}).catch(()=>{document.getElementById("main").innerHTML='<div class="empty">記事を読み込めませんでした。時間をおいて再度お試しください。</div>';});
render();
</script>
</body>
</html>
